<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-labelledby="title desc">
  <title id="title">TradeMindMZ logo</title>
  <desc id="desc">Neon crown and stylized M shield symbol with TradeMindMZ wordmark.</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f5a0"/>
      <stop offset="0.55" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#8a2be2"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
