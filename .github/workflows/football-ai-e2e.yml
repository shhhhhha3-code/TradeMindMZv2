name: Football AI E2E Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/football-ai/**"
      - "src/lib/footballApi.js"
      - ".github/workflows/football-ai-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check backend health
        shell: bash
        run: |
          set -euo pipefail
          url="https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/football-ai?action=health"
          body="$(curl -fsS --max-time 30 "$url")"
          echo "$body" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, d; print("Health:", d.get("status")); print("Football API:", d.get("footballApiConfigured")); print("Odds:", d.get("apiFootballOddsConfigured"))'

      - name: Run backend diagnostics
        shell: bash
        run: |
          set -euo pipefail
          url="https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/football-ai?action=diagnostics"
          body="$(curl -fsS --max-time 90 "$url")"
          echo "$body"
          BODY="$body" python - <<'PY'
          import json, os, sys
          data=json.loads(os.environ["BODY"])
          if data.get("ok") is not True:
              print("Diagnostics failed:", data.get("failures"))
              sys.exit(1)
          print("Diagnostics passed:", list(data.get("checks", {}).keys()))
          PY

      - name: Test dashboard read path
        shell: bash
        run: |
          set -euo pipefail
          url="https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/football-ai?action=dashboard&scope=upcoming"
          body="$(curl -fsS --max-time 45 "$url")"
          echo "$body" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, d; assert isinstance(d.get("matches"),list), d; assert isinstance(d.get("predictions"),list), d; print("Dashboard OK:", len(d["matches"]), "matches,", len(d["predictions"]), "predictions")'

      - name: Test learning read path
        shell: bash
        run: |
          set -euo pipefail
          url="https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/football-ai?action=learning"
          body="$(curl -fsS --max-time 45 "$url")"
          echo "$body"
          echo "$body" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, d; l=d.get("learning",{}); assert all(k in l for k in ["evaluated","wins","losses","voids","accuracy"]), d; print("Learning OK:", l)'

      - name: Test history read path
        shell: bash
        run: |
          set -euo pipefail
          url="https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/football-ai?action=history"
          body="$(curl -fsS --max-time 45 "$url")"
          echo "$body" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, d; assert isinstance(d.get("predictions"),list), d; assert isinstance(d.get("leagues"),list), d; print("History OK:", len(d["predictions"]), "predictions,", len(d["leagues"]), "leagues")'
