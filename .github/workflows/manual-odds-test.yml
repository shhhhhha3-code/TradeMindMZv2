name: Manual Odds Integration Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-odds-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run Football AI pipeline
        run: |
          response="$(curl --fail-with-body -sS --max-time 240 "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/football-ai?action=pipeline")"
          echo "$response"
          python - <<'PY' "$response"
          import json, sys
          d=json.loads(sys.argv[1])
          assert d.get("ok") is True, d
          print("ODDS:", json.dumps(d.get("odds"), ensure_ascii=False))
          print("SYNC:", json.dumps(d.get("sync"), ensure_ascii=False))
          PY
