name: Football AI Autonomous Engine

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/football-ai-scheduler.yml"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Backend health
        shell: bash
        run: |
          set -e
          url="https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/football-ai?action=health"
          curl -fsS --max-time 45 "$url" | tee /tmp/health.json
          jq -e '.ok == true' /tmp/health.json >/dev/null

      - name: Run Football AI pipeline
        shell: bash
        run: |
          set -e
          url="https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/football-ai?action=pipeline"
          for attempt in 1 2 3; do
            echo "Pipeline attempt $attempt/3"
            if curl -fsS --max-time 180 "$url" | tee /tmp/pipeline.json; then
              jq -e '.ok == true' /tmp/pipeline.json >/dev/null
              echo "Pipeline completed successfully."
              exit 0
            fi
            echo "Pipeline attempt failed."
            sleep $((attempt * 10))
          done
          echo "Football AI pipeline failed after 3 attempts."
          exit 1
