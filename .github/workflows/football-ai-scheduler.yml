# Phase 4 optimized pipeline verification
name: Football AI Autonomous Engine

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/football-ai-scheduler.yml"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Backend health
        shell: bash
        run: |
          set -e
          url="https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/football-ai?action=health"
          curl -fsS --max-time 45 "$url" | tee /tmp/health.json
          jq -e '.ok == true' /tmp/health.json >/dev/null
          if grep -q 'quota_exhausted' /tmp/health.json; then
            echo "Football Soccer API daily quota is exhausted. Skipping this cycle; it will resume after the provider reset."
            echo "SKIP_PIPELINE=1" >> "$GITHUB_ENV"
          fi

      - name: Run Football AI pipeline
        if: env.SKIP_PIPELINE != '1'
        shell: bash
        run: |
          set -e
          action="pipeline"
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            action="sync"
          fi
          url="https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/football-ai?action=$action"
          echo "Running Football AI $action"
          if curl -sS --max-time 140 "$url" | tee /tmp/pipeline.json; then
            jq -e '.ok == true' /tmp/pipeline.json >/dev/null
            echo "Pipeline completed successfully."
            exit 0
          fi
          echo "Football AI pipeline did not complete within the Edge Function request budget."
          exit 1
