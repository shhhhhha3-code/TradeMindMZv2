name: Deploy Football AI Edge Function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/football-ai/**"
      - "supabase/config.toml"
      - ".github/workflows/football-ai-function.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Deploy Football AI function
        run: supabase functions deploy football-ai --project-ref "$SUPABASE_PROJECT_ID" --use-api
      - name: Smoke test Football AI health
        run: |
          response="$(curl --fail-with-body -sS "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/football-ai?action=health")"
          echo "$response"
          python -c "import json,sys; d=json.loads(sys.argv[1]); assert d.get('ok') is True, d" "$response"
