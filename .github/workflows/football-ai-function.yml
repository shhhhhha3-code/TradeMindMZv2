name: Deploy Football AI Edge Function
# Manual redeploy trigger after runtime boot fix
# Trigger deployment on main changes.
# Force re-push / redeploy verification.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/football-ai/**"
      - "supabase/config.toml"
      - ".github/workflows/football-ai-function.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Football AI Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/football-ai/index.ts
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Deploy Football AI function
        run: supabase functions deploy football-ai --project-ref "$SUPABASE_PROJECT_ID" --use-api
      - name: Smoke test Football AI health
        run: |
          set -e
          url="https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/football-ai?action=health"
          for attempt in 1 2 3 4 5; do
            body="$(curl -sS "$url" || true)"
            echo "Health attempt $attempt: $body"
            if python -c "import json,sys; d=json.loads(sys.argv[1]); raise SystemExit(0 if d.get('ok') is True else 1)" "$body"; then
              exit 0
            fi
            sleep 3
          done
          echo "Football AI health endpoint did not return ok:true after retries" >&2
          exit 1
