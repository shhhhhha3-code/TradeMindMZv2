name: TradeMind Android Build

on:
  push:
    branches:
      - codex-android-capacitor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_API_BASE_URL: ${{ vars.TRADEMIND_API_URL }}
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Apply TradeMindMZ launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/drawable-nodpi
          mkdir -p android/app/src/main/res/values

          # Modern Android/Samsung: use a real adaptive icon so the launcher
          # does not display the SVG's square background as a hard-edged tile.
          convert resources/icon-foreground.svg -background none -resize 432x432 -gravity center -extent 432x432 android/app/src/main/res/drawable-nodpi/tmz_launcher_foreground.png

          cat > android/app/src/main/res/values/tmz_icon_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="tmz_icon_background">#05070B</color>
          </resources>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/tmz_icon_background" />
            <foreground android:drawable="@drawable/tmz_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/tmz_icon_background" />
            <foreground android:drawable="@drawable/tmz_launcher_foreground" />
          </adaptive-icon>
          EOF

          # Legacy Android fallback icons.
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            convert resources/icon.svg -background none -resize "${size}x${size}" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-${density}/ic_launcher.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeMindMZ-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
