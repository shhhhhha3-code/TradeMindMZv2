name: Build TradeMindMZ APK
# Force APK rebuild when backend-only changes need a matching mobile artifact.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/functions/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "capacitor.config.ts"
      - ".github/workflows/android.yml"
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Verify Capacitor packages
        run: npm ls @capacitor/core @capacitor/android @capacitor/cli
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TradeMindMZ-v4-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeMindMZ-APK
          path: TradeMindMZ-v4-debug.apk
          retention-days: 30
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trademindmz-v4-build-${{ github.run_number }}
          name: TradeMindMZ v4 APK build ${{ github.run_number }}
          prerelease: true
          files: TradeMindMZ-v4-debug.apk
