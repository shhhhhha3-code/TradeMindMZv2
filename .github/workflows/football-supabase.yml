name: Football AI Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20260930_football_ai_core.sql"

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Apply Football AI migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          python - <<'PY'
          import json
          with open("supabase/migrations/20260930_football_ai_core.sql", "r", encoding="utf-8") as f:
              sql = f.read()
          with open("/tmp/football-ai-migration.json", "w", encoding="utf-8") as f:
              json.dump({"query": sql}, f)
          PY
          curl --fail-with-body -sS \
            -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/football-ai-migration.json
