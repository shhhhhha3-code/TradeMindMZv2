name: Football AI Initial Run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/football-ai-initial-run.yml"

permissions:
  contents: read

jobs:
  initial-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Run Football AI pipeline
        run: |
          response="$(curl --fail-with-body -sS "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/football-ai?action=pipeline")"
          echo "$response"
          python - <<'PY' "$response"
          import json, sys
          data=json.loads(sys.argv[1])
          assert data.get("ok") is True, data
          print("Fixtures:", data.get("fixtures"))
          print("Evaluated:", data.get("evaluated"))
          print("Predictions:", data.get("sync",{}).get("predictionsCreated"))
          print("Odds stored:", data.get("sync",{}).get("oddsStored"))
          print("Training samples:", data.get("model",{}).get("training_samples"))
          PY
