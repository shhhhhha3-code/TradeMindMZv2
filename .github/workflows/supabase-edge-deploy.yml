name: Deploy TradeMindMZ Supabase Edge API

on:
  workflow_dispatch:
  push:
    branches:
      - codex-android-capacitor

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: codex-android-capacitor
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy Edge API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy trademind-api --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          python - <<'PY'
          import json
          with open("supabase/migrations/20260920_live_ai_persistence_scheduler.sql", "r", encoding="utf-8") as f:
              sql = f.read()
          with open("/tmp/trademind-migration.json", "w", encoding="utf-8") as f:
              json.dump({"query": sql}, f)
          PY
          curl --fail-with-body -sS \
            -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/trademind-migration.json

      - name: Runtime sanity check
        run: |
          set +e
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/diagnostics" \
            -o /tmp/trademind-diagnostics.json
          echo "=== diagnostics ==="
          cat /tmp/trademind-diagnostics.json
          echo
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/ai/latest?interval=15M&marketType=PERP&leverage=2" \
            -o /tmp/trademind-latest-sanity.json
          echo "=== ai/latest ==="
          cat /tmp/trademind-latest-sanity.json
          echo
          set -e

      - name: Smoke test live AI pipeline and persistence
        run: |
          set +e
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/ai/live-scan?force=1&interval=15M&marketType=PERP&leverage=2&maxMarkets=25" \
            -o /tmp/trademind-live.json
          CURL_STATUS=$?
          set -e
          echo "Live AI raw response:"
          cat /tmp/trademind-live.json
          echo
          echo "curl status: $CURL_STATUS"
          python - <<'PY'
          import json
          with open("/tmp/trademind-live.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          if not data.get("success"):
              raise SystemExit("Live AI smoke test failed: " + str(data))
          if not data.get("candidates"):
              raise SystemExit("Live AI smoke test returned no Engine TOP 5 candidates")
          if data.get("persistenceError"):
              raise SystemExit("Live AI snapshot persistence failed: " + str(data["persistenceError"]))
          print("Live AI OK:", len(data["candidates"]), "TOP 5 candidates")
          print("AI decision:", data.get("aiDecision", {}).get("decision"))
          print("Provider:", data.get("aiDecision", {}).get("provider"))
          print("Next analysis:", data.get("nextAnalysisAt"))
          PY

      - name: Dump Supabase Edge runtime logs on failure
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          START=$(date -u -d '15 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')
          END=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          SQL="select timestamp, event_message, level, log_attributes from logs where source = 'edge_logs' and timestamp >= toDateTime('$START') and timestamp <= toDateTime('$END') order by timestamp desc limit 100"
          curl --fail-with-body -sS --get \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/analytics/endpoints/logs" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --data-urlencode "sql=$SQL" \
            --data-urlencode "iso_timestamp_start=$START" \
            --data-urlencode "iso_timestamp_end=$END" \
            -o /tmp/trademind-edge-logs.json
          echo "=== Supabase Edge runtime logs ==="
          cat /tmp/trademind-edge-logs.json
      - name: Verify persisted latest snapshot
        run: |
          curl --fail-with-body -sS \
            "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/ai/latest?interval=15M&marketType=PERP&leverage=2" \
            -o /tmp/trademind-latest.json
          python - <<'PY'
          import json
          with open("/tmp/trademind-latest.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          if not data.get("success") or not data.get("available"):
              raise SystemExit("Latest snapshot verification failed: " + str(data))
          snapshot = data.get("snapshot") or {}
          if not snapshot.get("candidates"):
              raise SystemExit("Latest snapshot has no candidates")
          print("Persisted snapshot OK:", snapshot.get("persistedAt"))
          PY

      - name: Verify server position monitoring and trade journal API
        run: |
          curl --fail-with-body -sS \
            "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/ai/position-monitoring" \
            -o /tmp/trademind-position-monitoring.json
          python - <<'PY'
          import json
          with open("/tmp/trademind-position-monitoring.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          if not data.get("success"):
              raise SystemExit("Position monitoring verification failed: " + str(data))
          if data.get("readOnly") is not True or data.get("serverSide") is not True:
              raise SystemExit("Position monitoring safety flags are incorrect: " + str(data))
          stats = data.get("journalStats") or {}
          print("Position monitoring API OK:", len(data.get("positions") or []), "open positions")
          print("Trade journal:", stats.get("total"), "rows")
          PY
