              raise SystemExit("Trade journal stats contain invalid values: " + str(data))
          if stats["total"] < 0 or stats["open"] < 0 or stats["closed"] < 0 or stats["closedCountWithPnl"] < 0:
              raise SystemExit("Trade journal stats contain negative counts: " + str(data))
          if stats["open"] + stats["closed"] > stats["total"]:
              raise SystemExit("Trade journal counts exceed total: " + str(data))
