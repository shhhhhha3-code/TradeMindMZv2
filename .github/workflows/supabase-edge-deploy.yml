name: Deploy TradeMindMZ Supabase Edge API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: codex-android-capacitor
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Configure FCM server secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FCM_SERVICE_ACCOUNT_JSON" ]; then
            supabase secrets set FCM_SERVICE_ACCOUNT_JSON="$FCM_SERVICE_ACCOUNT_JSON" --project-ref "$SUPABASE_PROJECT_ID"
            echo "FCM server secret configured."
          else
            echo "::warning::FCM_SERVICE_ACCOUNT_JSON is not configured. Qualified trade push sending will remain disabled until Firebase server credentials are added."
          fi

      - name: Deploy Edge API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy trademind-api --project-ref "$SUPABASE_PROJECT_ID"
