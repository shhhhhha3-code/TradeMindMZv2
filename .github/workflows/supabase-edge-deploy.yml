name: Deploy TradeMindMZ AI Engine
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/football-ai/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-edge-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Function syntax and imports
        shell: bash
        run: |
          set -uo pipefail
          output="$(mktemp)"
          if deno check --no-lock supabase/functions/football-ai/index.ts >"$output" 2>&1; then
            cat "$output"
            exit 0
          fi
          cat "$output"
          if grep -Eq 'TS1308|TS1005|TS1109|SyntaxError:|Unexpected reserved word|Import .* failed|Module not found' "$output"; then
            echo "::error::Edge Function has a syntax or import blocker."
            exit 1
          fi
          echo "::warning::Deno reported TypeScript type diagnostics, but no syntax/import boot blocker was detected."
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Deploy football-ai
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy football-ai --project-ref "imnnpilqjzfhvijhipzu" --use-api
      - name: Smoke test football-ai endpoint
        shell: bash
        run: |
          set -euo pipefail
          url="https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/football-ai"
          options_code="$(curl -sS -o /tmp/options.txt -w '%{http_code}' -X OPTIONS "$url" -H 'Origin: https://localhost' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type')"
          echo "CORS preflight HTTP: $options_code"
          cat /tmp/options.txt
          test "$options_code" = "204"
          method_code="$(curl -sS -o /tmp/method.json -w '%{http_code}' -X GET "$url")"
          echo "GET rejection HTTP: $method_code"
          test "$method_code" = "405"
          invalid_json_code="$(curl -sS -o /tmp/invalid-json.json -w '%{http_code}' -X POST "$url" -H 'Content-Type: application/json' --data '{invalid-json')"
          echo "Invalid JSON HTTP: $invalid_json_code"
          test "$invalid_json_code" = "400"
          unknown_action_code="$(curl -sS -o /tmp/unknown-action.json -w '%{http_code}' -X POST "$url" -H 'Content-Type: application/json' --data '{"action":"__phase7_unknown_action__"}')"
          echo "Unknown action HTTP: $unknown_action_code"
          test "$unknown_action_code" = "400"
          oversized_body="$(printf '{"action":"diagnostics","padding":"%*s"}' 16400 '')"
          oversized_code="$(curl -sS -o /tmp/oversized.json -w '%{http_code}' -X POST "$url" -H 'Content-Type: application/json' --data-binary "$oversized_body")"
          echo "Oversized body HTTP: $oversized_code"
          test "$oversized_code" = "413"
          post_code="$(curl -sS -o /tmp/diagnostics.json -w '%{http_code}' -X POST "$url" -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"action":"diagnostics"}')"
          echo "Diagnostics HTTP: $post_code"
          cat /tmp/diagnostics.json
          test "$post_code" = "200"
          eval_diag_code="$(curl -sS --max-time 20 -o /tmp/evaluate-diagnostics.json -w '%{http_code}' -X POST "$url" -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"action":"evaluate_diagnostics"}')"
          echo "Evaluation diagnostics HTTP: $eval_diag_code"
          cat /tmp/evaluate-diagnostics.json
          test "$eval_diag_code" = "200"
          grep -Eq '"status":"(OK|WARNING)"' /tmp/evaluate-diagnostics.json
          results_audit_code="$(curl -sS --max-time 20 -o /tmp/results-audit.json -w '%{http_code}' -X POST "$url" -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"action":"results_audit"}')"
          echo "Read-only results audit HTTP: $results_audit_code"
          cat /tmp/results-audit.json
          test "$results_audit_code" = "200"
          grep -Eq '"read_only":true' /tmp/results-audit.json
          grep -Eq '"open_with_final_score":[0-9]+' /tmp/results-audit.json
          results_code="$(curl -sS --max-time 20 -o /tmp/results.json -w '%{http_code}' -X POST "$url" -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"action":"results"}')"
          echo "Results HTTP: $results_code"
          cat /tmp/results.json
          test "$results_code" = "200"
          grep -Eq '"status":"(READY|SCANNING)"' /tmp/results.json

      - name: Fetch Supabase boot error logs
        if: failure()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -u
          start="$(date -u -d '30 minutes ago' +'%Y-%m-%dT%H:%M:%SZ')"
          end="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sql="SELECT timestamp, source, event_message, log_attributes FROM logs WHERE source = 'function_logs' AND (event_message LIKE '%BootFailure%' OR event_message LIKE '%worker boot error%' OR log_attributes['event_type'] = 'BootFailure') ORDER BY timestamp DESC LIMIT 20"
          echo "Fetching recent Supabase Edge Function boot logs..."
          curl -sS --get "https://api.supabase.com/v1/projects/imnnpilqjzfhvijhipzu/analytics/endpoints/logs" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --data-urlencode "sql=${sql}" \
            --data-urlencode "iso_timestamp_start=${start}" \
            --data-urlencode "iso_timestamp_end=${end}" || true
