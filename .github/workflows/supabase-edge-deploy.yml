name: Deploy TradeMindMZ AI Engine\non:\n  push:\n    branches: [main]\n    paths:\n      - "supabase/functions/football-ai/**"\n      - "supabase/config.toml"\n      - ".github/workflows/supabase-edge-deploy.yml"\n  workflow_dispatch:\npermissions:\n  contents: read\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: supabase/setup-cli@v2\n        with:\n          version: latest\n      - name: Deploy football-ai\n        env:\n          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}\n          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}\n        run: supabase functions deploy football-ai --project-ref "$SUPABASE_PROJECT_ID" --use-api\n