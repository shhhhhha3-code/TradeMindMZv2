name: Deploy TradeMindMZ Supabase Edge API

on:
  workflow_dispatch:
  push:
    branches:
      - codex-android-capacitor

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: codex-android-capacitor
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy Edge API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy trademind-api --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          python - <<'PY'
          import json
          with open("supabase/migrations/20260920_live_ai_persistence_scheduler.sql", "r", encoding="utf-8") as f:
              sql = f.read()
          with open("/tmp/trademind-migration.json", "w", encoding="utf-8") as f:
              json.dump({"query": sql}, f)
          PY
          curl --fail-with-body -sS \
            -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/trademind-migration.json
