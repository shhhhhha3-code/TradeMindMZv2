name: Deploy TradeMindMZ Supabase Edge API

on:
  workflow_dispatch:
  push:
    branches:
      - codex-android-capacitor

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: codex-android-capacitor
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Validate Supabase deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is missing."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::SUPABASE_PROJECT_ID secret is missing."
            exit 1
          fi
          echo "Supabase deployment credentials are present. Validating token/project access..."
          set +e
          HTTP_STATUS=$(curl -sS -o /tmp/supabase-project.json -w "%{http_code}" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID")
          CURL_STATUS=$?
          set -e
          if [ "$CURL_STATUS" -ne 0 ]; then
            echo "::error::Could not contact Supabase Management API (curl status $CURL_STATUS)."
            exit 1
          fi
          if [ "$HTTP_STATUS" = "401" ]; then
            echo "::error::Supabase Management API returned HTTP 401. SUPABASE_ACCESS_TOKEN is invalid, expired/revoked, or is not a Supabase Management API access token."
            echo "::error::Generate a new Supabase Access Token and update the GitHub Actions secret named SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Supabase Management API returned HTTP $HTTP_STATUS for project access."
            cat /tmp/supabase-project.json
            exit 1
          fi
          echo "Supabase project access validated successfully."

      - name: Deploy Edge API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy trademind-api --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          python - <<'PY'
          import json
          migration_paths = [
              "supabase/migrations/20260920_live_ai_persistence_scheduler.sql",
              "supabase/migrations/20260925_scheduler_hardening.sql",
              "supabase/migrations/20260925_scheduler_observability.sql",
              "supabase/migrations/20260927_scheduler_heartbeat_hardening.sql",
          ]
          sql_parts = []
          for path in migration_paths:
              with open(path, "r", encoding="utf-8") as f:
                  sql_parts.append(f.read())
          with open("/tmp/trademind-migration.json", "w", encoding="utf-8") as f:
              json.dump({"query": "\n\n".join(sql_parts)}, f)
          PY
          curl --fail-with-body -sS \
            -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/trademind-migration.json

      - name: Trigger scheduler once for post-deploy verification
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open("/tmp/trademind-scheduler-trigger.json", "w", encoding="utf-8") as f:
              json.dump({"query": "select public.trademind_run_ai_scheduler();"}, f)
          PY
          echo "Triggering one scheduler run so the deployment can verify the real server-side scheduler immediately."
          curl --fail-with-body -sS \
            -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/trademind-scheduler-trigger.json
          echo

      - name: Wait for fresh scheduler heartbeat
        run: |
          set -euo pipefail
          URL="https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/diagnostics"
          scheduler_ok=false
          for attempt in $(seq 1 18); do
            echo "Scheduler SUCCESS verification attempt $attempt/18"
            curl --fail-with-body -sS "$URL" -o /tmp/trademind-scheduler-diagnostics.json
            if python - <<'PY'
          import json
          with open("/tmp/trademind-scheduler-diagnostics.json", encoding="utf-8") as f:
              data=json.load(f)
          scheduler=next((x for x in data.get("checks",[]) if x.get("name")=="Scheduler"),{})
          details=scheduler.get("details") or {}
          status=scheduler.get("status")
          age=details.get("ageSeconds")
          active=details.get("activeStatus")
          print("Scheduler:", status, "active:", active, "heartbeat:", details.get("heartbeatAt"), "age:", age)
          fresh=isinstance(age,(int,float)) and age <= 900
          success=status == "SUCCESS" and fresh
          raise SystemExit(0 if success else 1)
          PY
            then
              echo "Completed scheduler SUCCESS run confirmed."
              scheduler_ok=true
              break
            fi
            sleep 10
          done
          if [ "$scheduler_ok" != "true" ]; then
            echo "::error::Scheduler did not complete a fresh SUCCESS run after the deployment trigger."
            cat /tmp/trademind-scheduler-diagnostics.json
            exit 1
          fi

      - name: Runtime sanity check
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/diagnostics" \
            -o /tmp/trademind-diagnostics.json
          echo "=== diagnostics ==="
          cat /tmp/trademind-diagnostics.json
          echo
          python - <<'PY'
          import json
          with open("/tmp/trademind-diagnostics.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          scheduler = next((x for x in data.get("checks", []) if x.get("name") == "Scheduler"), {})
          details = scheduler.get("details") or {}
          if not details.get("heartbeatAt"):
              raise SystemExit("Scheduler heartbeatAt missing after deployment.")
          print("Scheduler heartbeat OK:", details.get("heartbeatAt"), "age:", details.get("ageSeconds"))
          PY
          echo
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/ai/latest?interval=15M&marketType=PERP&leverage=3" \
            -o /tmp/trademind-latest-sanity.json
          echo "=== ai/latest ==="
          cat /tmp/trademind-latest-sanity.json
          echo
          set -e

      - name: Smoke test live AI pipeline and persistence
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/ai/live-scan?force=1&interval=15M&marketType=PERP&leverage=2&maxMarkets=25" \
            -o /tmp/trademind-live.json
          echo "Live AI raw response:"
          cat /tmp/trademind-live.json
          echo
          python - <<'PY'
          import json
          with open("/tmp/trademind-live.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          if not data.get("success"):
              raise SystemExit("Live AI smoke test failed: " + str(data))
          if not data.get("candidates"):
              raise SystemExit("Live AI smoke test returned no Engine TOP 5 candidates")
          if data.get("serverSide") is not True:
              raise SystemExit("Live AI smoke test did not report serverSide=true: " + str(data))
          pipeline = data.get("decisionPipeline") or {}
          if pipeline.get("readOnly") is not True or pipeline.get("automaticTrading") is not False:
              raise SystemExit("Live AI safety contract is incorrect: " + str(pipeline))
          if data.get("persistenceError"):
              raise SystemExit("Live AI snapshot persistence failed: " + str(data["persistenceError"]))
          print("Live AI OK:", len(data["candidates"]), "TOP 5 candidates")
          print("AI decision:", data.get("aiDecision", {}).get("decision"))
          print("Provider:", data.get("aiDecision", {}).get("provider"))
          print("Next analysis:", data.get("nextAnalysisAt"))
          PY

      - name: Verify fresh persisted PERP snapshot after live scan
        run: |
          set -euo pipefail
          curl --fail-with-body -sS             "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/ai/latest?interval=15M&marketType=PERP&leverage=2"             -o /tmp/trademind-live-latest.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          with open("/tmp/trademind-live-latest.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          if not data.get("success") or not data.get("available"):
              raise SystemExit("Fresh PERP snapshot verification failed: " + str(data))
          snapshot = data.get("snapshot") or {}
          persisted_at = snapshot.get("persistedAt")
          if not persisted_at:
              raise SystemExit("Fresh PERP snapshot is missing persistedAt: " + str(data))
          age_seconds = (datetime.now(timezone.utc) - datetime.fromisoformat(persisted_at.replace("Z", "+00:00"))).total_seconds()
          if age_seconds < -30 or age_seconds > 300:
              raise SystemExit(f"Fresh PERP snapshot is outside the expected 5-minute window: age={age_seconds:.1f}s, persistedAt={persisted_at}")
          if snapshot.get("marketType") != "PERP" or not snapshot.get("candidates"):
              raise SystemExit("Fresh PERP snapshot has invalid market/candidate data: " + str(snapshot))
          print(f"Fresh persisted PERP snapshot OK: age={age_seconds:.1f}s, persistedAt={persisted_at}")
          PY

      - name: Verify API edge-case safety behavior
        run: |
          set -euo pipefail
          BASE="https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api"

          echo "Checking invalid risk-sizing input is rejected without enabling trading..."
          risk_status=$(curl -sS -o /tmp/trademind-risk-invalid.json -w "%{http_code}"             -X POST             -H "Content-Type: application/json"             -d '{"balanceUsdt":1000,"entryPrice":100,"stopLoss":100,"riskPercent":1,"maxAllocationPercent":25,"marketType":"PERP"}'             "$BASE/api/ai/risk-size")
          cat /tmp/trademind-risk-invalid.json
          echo
          python - "$risk_status" <<'PY'
          import json, sys
          status = int(sys.argv[1])
          with open("/tmp/trademind-risk-invalid.json", encoding="utf-8") as f:
              data = json.load(f)
          if status != 400:
              raise SystemExit(f"Invalid risk input returned HTTP {status}, expected 400: {data}")
          if data.get("success") is not False:
              raise SystemExit("Invalid risk input unexpectedly reported success: " + str(data))
          if data.get("readOnly") is not True or data.get("automaticTrading") is not False:
              raise SystemExit("Invalid risk input changed safety flags: " + str(data))
          print("Invalid risk sizing correctly rejected with read-only safety preserved.")

          PY

          echo "Checking unsupported Copilot action is rejected safely..."
          copilot_status=$(curl -sS -o /tmp/trademind-copilot-invalid.json -w "%{http_code}"             -X POST             -H "Content-Type: application/json"             -d '{"action":"EXECUTE_TRADE","marketType":"PERP","message":"test"}'             "$BASE/api/ai/copilot")
          cat /tmp/trademind-copilot-invalid.json
          echo
          python - "$copilot_status" <<'PY'
          import json, sys
          status = int(sys.argv[1])
          with open("/tmp/trademind-copilot-invalid.json", encoding="utf-8") as f:
              data = json.load(f)
          if status != 400:
              raise SystemExit(f"Unsupported Copilot action returned HTTP {status}, expected 400: {data}")
          if data.get("success") is not False:
              raise SystemExit("Unsupported Copilot action unexpectedly reported success: " + str(data))
          print("Unsupported Copilot action correctly rejected.")
          PY

          echo "Checking health endpoint reports read-only trading state..."
          curl --fail-with-body -sS "$BASE/api/health" -o /tmp/trademind-health.json
          python - <<'PY'
          import json
          with open("/tmp/trademind-health.json", encoding="utf-8") as f:
              data = json.load(f)
          if data.get("success") is not True or data.get("status") != "ONLINE":
              raise SystemExit("Health endpoint is not ONLINE: " + str(data))
          if data.get("pionex") != "READ_ONLY" or data.get("trading") is not False:
              raise SystemExit("Health endpoint safety state is incorrect: " + str(data))
          print("Health/read-only safety gate: PASS")
          PY

          echo "API edge-case safety verification: PASS"

      - name: Verify Copilot context engine and read-only contract
        run: |
          set -euo pipefail
          BASE="https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api"

          copilot_status=$(curl -sS -o /tmp/trademind-copilot-context.json -w "%{http_code}"             -X POST             -H "Content-Type: application/json"             -d '{"action":"ASK","marketType":"PERP","message":"What changed since the previous market analysis?","history":[{"role":"user","content":"What was the previous market state?"},{"role":"assistant","content":"Use the previous supplied TradeMind context and compare it with the current state."}]}'             "$BASE/api/ai/copilot")

          export COPILOT_STATUS="$copilot_status"
          echo "Copilot HTTP status: $copilot_status"
          cat /tmp/trademind-copilot-context.json
          echo
          python - <<'PY'
          import json, os
          with open("/tmp/trademind-copilot-context.json", encoding="utf-8") as f:
              data = json.load(f)
          status = os.environ.get("COPILOT_STATUS", "0")
          if status != "200":
              raise SystemExit("Copilot context HTTP failure: " + status + " " + str(data))

          if data.get("success") is not True:
              raise SystemExit("Copilot context smoke test failed: " + str(data))
          if data.get("conversationTurnsUsed") != 2:
              raise SystemExit("Copilot did not consume the expected conversation context: " + str(data))
          if data.get("readOnly") is not True:
              raise SystemExit("Copilot readOnly contract is incorrect: " + str(data))
          if data.get("automaticTrading") is not False or data.get("noOrderPlacement") is not True:
              raise SystemExit("Copilot trading safety contract is incorrect: " + str(data))
          if data.get("suggestedAction") not in {"NONE","LIVE_SIGNAL","BEST_SETUP","WHAT_NOW","POSITION_CHECK","DEEP_ANALYSIS","STATUS","DIAGNOSTICS","ASK"}:
              raise SystemExit("Copilot returned an invalid suggestedAction: " + str(data))
          print("Copilot context engine + read-only contract: PASS")
          print("Context turns used:", data.get("conversationTurnsUsed"))
          print("Decision delta:", data.get("snapshotDelta"))
          PY

      - name: Dump Supabase Edge runtime logs on failure
        if: always()
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          START=$(date -u -d '15 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')
          END=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          SQL="select timestamp, event_message, log_attributes from logs order by timestamp desc limit 100"
          curl --fail-with-body -sS --get \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/analytics/endpoints/logs" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --data-urlencode "sql=$SQL" \
            --data-urlencode "iso_timestamp_start=$START" \
            --data-urlencode "iso_timestamp_end=$END" \
            -o /tmp/trademind-edge-logs.json
          echo "=== Supabase Edge runtime logs ==="
          cat /tmp/trademind-edge-logs.json
      - name: Verify SPOT, risk sizing, learning and monitoring APIs
        run: |
          set -euo pipefail
          # SPOT live-scan can legitimately return HTTP 429 when the upstream market-data provider is rate-limited.
          # Retry that verification call instead of failing the whole deploy immediately.
          echo "Running SPOT live-scan verification with bounded retry/backoff..."
          curl --fail-with-body -sS \
            --connect-timeout 10 --max-time 120 \
            --retry 5 --retry-delay 10 --retry-max-time 90 --retry-connrefused \
            "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/ai/live-scan?force=1&interval=15M&marketType=SPOT&maxMarkets=25" \
            -o /tmp/trademind-spot-live.json
          curl --fail-with-body -sS \
            "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/ai/spot-monitoring" \
            -o /tmp/trademind-spot-monitoring.json
          curl --fail-with-body -sS \
            "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/ai/learning-stats" \
            -o /tmp/trademind-learning.json
          curl --fail-with-body -sS \
            "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/ai/performance-summary" \
            -o /tmp/trademind-performance.json
          curl --fail-with-body -sS \
            "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/ai/trade-criteria" \
            -o /tmp/trademind-criteria.json
          curl --fail-with-body -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"balanceUsdt":1000,"entryPrice":100,"stopLoss":98,"riskPercent":1,"maxAllocationPercent":25,"marketType":"SPOT"}' \
            "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/ai/risk-size" \
            -o /tmp/trademind-risk.json
          python - <<'PY'
          import json
          def load(path):
              with open(path, encoding="utf-8") as f: return json.load(f)
          spot=load('/tmp/trademind-spot-live.json')
          monitor=load('/tmp/trademind-spot-monitoring.json')
          learning=load('/tmp/trademind-learning.json')
          performance=load('/tmp/trademind-performance.json')
          criteria=load('/tmp/trademind-criteria.json')
          risk=load('/tmp/trademind-risk.json')
          if not spot.get('success') or not spot.get('candidates'): raise SystemExit('SPOT live AI verification failed: '+str(spot))
          if spot.get('marketType') != 'SPOT': raise SystemExit('SPOT live AI returned wrong market type: '+str(spot))
          if not monitor.get('success') or monitor.get('readOnly') is not True or monitor.get('serverSide') is not True: raise SystemExit('SPOT monitoring verification failed: '+str(monitor))
          if not learning.get('success'): raise SystemExit('Learning stats verification failed: '+str(learning))
          if not performance.get('success') or not performance.get('windows'): raise SystemExit('Performance summary verification failed: '+str(performance))
          if not criteria.get('success') or not criteria.get('criteria'): raise SystemExit('Trade criteria verification failed: '+str(criteria))
          if not risk.get('success') or risk.get('readOnly') is not True or risk.get('automaticTrading') is not False: raise SystemExit('Risk sizing verification failed: '+str(risk))
          position_size = risk.get('positionSizeUsdt', risk.get('suggestedNotionalUsdt'))
          allocation_cap = risk.get('allocationCapUsdt')
          if not isinstance(position_size, (int, float)) or position_size < 0:
              raise SystemExit('Risk sizing returned an invalid suggested position size: '+str(risk))
          if isinstance(allocation_cap, (int, float)) and position_size > allocation_cap:
              raise SystemExit('Risk sizing exceeded allocation cap: '+str(risk))
          print('SPOT live AI OK:', len(spot['candidates']), 'TOP 5 candidates')
          print('SPOT monitoring OK:', len(monitor.get('holdings') or []), 'holdings')
          print('Learning stats OK:', learning.get('totalAnalyses'))
          print('Performance summary OK:', list((performance.get('windows') or {}).keys()))
          print('Trade criteria OK:', criteria.get('criteria'))
          print('Risk sizing OK:', risk.get('positionSizeUsdt'))
          PY
      - name: Verify persisted SPOT snapshot
        run: |
          set -euo pipefail
          curl --fail-with-body -sS             "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/ai/latest?interval=15M&marketType=SPOT&leverage=1"             -o /tmp/trademind-latest-spot.json
          python - <<'PY'
          import json
          with open("/tmp/trademind-latest-spot.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          if not data.get("success") or not data.get("available"):
              raise SystemExit("Latest SPOT snapshot verification failed: " + str(data))
          snapshot = data.get("snapshot") or {}
          if snapshot.get("marketType") != "SPOT":
              raise SystemExit("Latest SPOT snapshot returned wrong market type: " + str(snapshot))
          if not snapshot.get("candidates"):
              raise SystemExit("Latest SPOT snapshot has no candidates")
          print("Persisted SPOT snapshot OK:", snapshot.get("persistedAt"))
          PY

      - name: Verify persisted latest snapshot
        run: |
          curl --fail-with-body -sS \
            "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/ai/latest?interval=15M&marketType=PERP&leverage=3" \
            -o /tmp/trademind-latest.json
          python - <<'PY'
          import json
          with open("/tmp/trademind-latest.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          if not data.get("success") or not data.get("available"):
              raise SystemExit("Latest snapshot verification failed: " + str(data))
          snapshot = data.get("snapshot") or {}
          if not snapshot.get("candidates"):
              raise SystemExit("Latest snapshot has no candidates")
          print("Persisted snapshot OK:", snapshot.get("persistedAt"))
          PY

      - name: Verify scheduler heartbeat and diagnostics
        run: |
          set -euo pipefail
          curl --fail-with-body -sS             "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/diagnostics"             -o /tmp/trademind-diagnostics.json
          python - <<'PY'
          import json
          with open("/tmp/trademind-diagnostics.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          scheduler = data.get("scheduler") or {}
          scheduler_status = scheduler.get("status")
          if scheduler_status not in ("SUCCESS", "QUEUED", "RUNNING"):
              raise SystemExit("Scheduler heartbeat has unexpected status: " + str(scheduler))
          scheduler_check = next((c for c in data.get("checks", []) if c.get("name") == "Scheduler"), None)
          if not scheduler_check or scheduler_check.get("status") not in ("OK", "SLOW"):
              raise SystemExit("Scheduler diagnostics check failed: " + str(scheduler_check))
          heartbeat = scheduler_check.get("details", {}).get("heartbeatAt")
          if not heartbeat:
              raise SystemExit("Scheduler heartbeat timestamp is missing: " + str(scheduler_check))
          print("Scheduler heartbeat OK:", heartbeat)
          print("Scheduler stage:", scheduler_check.get("details", {}).get("currentStage"))
          print("Scheduler cadence:", scheduler_check.get("details", {}).get("cadenceMinutes"), "minutes")
          PY

      - name: Verify production diagnostics safety semantics
        run: |
          set -euo pipefail
          curl --fail-with-body -sS             "https://imnnpilqjzfhvijhipzu.supabase.co/functions/v1/trademind-api/api/diagnostics"             -o /tmp/trademind-diagnostics-safety.json
          python - <<'PY'
          import json
          with open("/tmp/trademind-diagnostics-safety.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          checks = {item.get("name"): item for item in data.get("checks", [])}
          scheduler = checks.get("Scheduler") or {}
          pionex = checks.get("Pionex") or {}
          market_ai = checks.get("Market AI") or {}
          groq = checks.get("Groq AI") or {}
          if scheduler.get("status") not in ("OK", "SLOW"):
              raise SystemExit("Production safety gate: scheduler is not healthy: " + str(scheduler))
          if groq.get("status") not in ("CONFIGURED", "OK"):
              raise SystemExit("Production safety gate: Groq provider is not configured: " + str(groq))
          if pionex.get("details", {}).get("readOnly") is not True:
              raise SystemExit("Production safety gate: Pionex is not explicitly read-only: " + str(pionex))
          warning_states = {"STALE", "ERROR"}
          if (pionex.get("status") in warning_states or market_ai.get("status") in warning_states) and data.get("success") is True:
              raise SystemExit("Diagnostics incorrectly reports success while a critical market-data/AI check is stale or errored: " + str(data))
          print("Production diagnostics safety semantics OK")
