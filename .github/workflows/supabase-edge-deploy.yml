name: Deploy TradeMindMZ Football AI Edge Function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/football-ai/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-edge-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy football-ai
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy football-ai --project-ref "$SUPABASE_PROJECT_ID" --use-api
