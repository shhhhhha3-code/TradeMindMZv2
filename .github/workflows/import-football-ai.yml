name: Import Football AI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Football AI source ZIP
        shell: bash
        run: |
          set -e
          curl -fL --retry 3 -o /tmp/football-ai.zip "https://github.com/shhhhhha3-code/TradeMindMZ/raw/refs/heads/main/football-ai-app.zip"
          unzip -t /tmp/football-ai.zip >/dev/null

      - name: Replace project with Football AI
        shell: bash
        run: |
          set -e
          rm -rf /tmp/football-ai
          mkdir -p /tmp/football-ai
          unzip -q /tmp/football-ai.zip -d /tmp/football-ai
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/football-ai/football-ai-app/. .
          rm -f football-ai-app.zip
          rm -rf /tmp/football-ai /tmp/football-ai.zip

      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Replace TradeMindMZv2 with Football AI"
          git push
