name: Deploy TradeMindMZ App
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Package web app
        run: cd dist && zip -r ../trademindmz-web-app.zip .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: trademindmz-web-app
          path: trademindmz-web-app.zip
      - name: Publish Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
