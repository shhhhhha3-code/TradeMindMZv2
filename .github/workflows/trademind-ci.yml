name: TradeMind CI

on:
  push:
    branches:
      - main
      - codex-engine-v2-tests
      - codex-android-capacitor
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Engine tests
        run: node --test tests/engine/*.test.js

      - name: Run AI tests
        run: node --test tests/ai/*.test.js

      - name: Run paper-learning tests
        run: node --test tests/paper/*.test.js

      - name: Run position tests
        run: node --test tests/positions/*.test.js

      - name: Build frontend
        run: npm run build
