name: TradeMind CI

on:
  push:
    branches:
      - main
      - codex-engine-v2-tests
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Engine tests
        run: node --test tests/engine/*.test.js

      - name: Build frontend
        run: npm run build
