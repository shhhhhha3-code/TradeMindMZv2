<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#020c13" />
  <meta name="color-scheme" content="dark" />
  <title>TradeMindMZ</title>
  <style>
    html,body{margin:0;min-height:100%;background:#020c13}
    #root{min-height:100vh}
    #boot{min-height:100vh;display:grid;place-items:center;background:#020c13;color:#9fb8c2;font:700 12px system-ui,sans-serif;letter-spacing:1px}
    #boot strong{color:#00f0a0}
    .bootCard{text-align:center;padding:24px}
  </style>
</head>
<body>
  <div id="root">
    <div id="boot"><div class="bootCard"><strong>TRADEMINDMZ</strong><div>STARTER APPEN…</div></div></div>
  </div>
  <script>
    window.__tmBooted=false;
    window.addEventListener("error",function(e){
      if(window.__tmBooted)return;
      var root=document.getElementById("root");
      if(root)root.innerHTML='<div id="boot"><div class="bootCard"><strong>TRADEMINDMZ</strong><div>Kunne ikke starte appen.</div></div></div>';
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
